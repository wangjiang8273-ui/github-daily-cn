<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="每天自动发现 GitHub 上值得关注的热门开源应用，并提供中文简介。" />
  <meta name="color-scheme" content="light" />
  <title>开源日见｜每日 GitHub 开源应用精选</title>
  <style>
    :root {
      --bg: #f3f1eb;
      --paper: rgba(255, 255, 255, .78);
      --paper-solid: #fbfaf7;
      --ink: #171814;
      --muted: #6f7169;
      --line: rgba(30, 33, 27, .10);
      --accent: #3f604a;
      --accent-soft: #dfe9df;
      --warm: #b97446;
      --shadow: 0 18px 50px rgba(35, 40, 30, .08);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --max: 1240px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 2%, rgba(255,255,255,.95), transparent 33%),
        radial-gradient(circle at 92% 10%, rgba(210,224,210,.68), transparent 28%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: .01em;
    }

    button, input, select { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 720;
      letter-spacing: -.03em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(25, 30, 24, .16);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.62);
      box-shadow: inset 0 0 0 5px rgba(63, 96, 74, .06);
    }

    .brand-mark span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 8px -5px 0 -2px rgba(185,116,70,.9);
    }

    .top-meta {
      font-size: 13px;
      color: var(--muted);
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 350px;
      padding: 68px clamp(24px, 6vw, 76px);
      margin: 12px 0 28px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(135deg, rgba(255,255,255,.88), rgba(244,246,240,.72)),
        var(--paper-solid);
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::before {
      right: -105px;
      top: -170px;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(63,96,74,.12);
      box-shadow:
        0 0 0 45px rgba(63,96,74,.03),
        0 0 0 95px rgba(63,96,74,.025);
    }

    .hero::after {
      right: 138px;
      bottom: 54px;
      width: 14px;
      height: 14px;
      background: var(--warm);
      box-shadow: 28px -20px 0 -4px var(--accent), 48px 9px 0 -5px rgba(63,96,74,.5);
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
    }

    h1 {
      max-width: 760px;
      margin: 22px 0 18px;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1.04;
      letter-spacing: -.065em;
      font-weight: 680;
    }

    .hero p {
      max-width: 650px;
      margin: 0;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.8;
      color: var(--muted);
    }

    .hero-status {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 36px;
      font-size: 13px;
      color: var(--muted);
    }

    .hero-status span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5f8b69;
      box-shadow: 0 0 0 5px rgba(95,139,105,.11);
    }

    .controls {
      position: sticky;
      top: 12px;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 22px;
      background: rgba(248,247,242,.83);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 12px 32px rgba(28,31,25,.07);
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 14px;
      height: 46px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .search-wrap svg { flex: none; opacity: .55; }
    .search-wrap input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }

    .select {
      height: 46px;
      min-width: 130px;
      padding: 0 38px 0 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255,255,255,.72);
      outline: 0;
    }

    .refresh-btn {
      height: 46px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    .refresh-btn:hover { transform: translateY(-1px); }
    .refresh-btn:disabled { cursor: wait; opacity: .55; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 26px;
    }

    .chip {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.48);
      cursor: pointer;
      transition: .18s ease;
    }

    .chip:hover,
    .chip.active {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      letter-spacing: -.045em;
      font-weight: 650;
    }

    .section-head p {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
      padding-bottom: 70px;
    }

    .card {
      grid-column: span 4;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 420px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: 0 10px 30px rgba(28,31,25,.055);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(63,96,74,.18);
      box-shadow: 0 22px 44px rgba(28,31,25,.09);
    }

    .card.featured { grid-column: span 6; min-height: 450px; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 14px;
    }

    .rank {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
    }

    .category {
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(27,29,25,.05);
      font-size: 12px;
    }

    .repo-title {
      margin: 24px 0 8px;
      font-size: 24px;
      line-height: 1.18;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }

    .owner {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .description {
      margin: 0;
      color: #3d4039;
      font-size: 15px;
      line-height: 1.78;
    }

    .original {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 18px 0 0;
    }

    .highlight {
      padding: 6px 9px;
      border: 1px solid rgba(63,96,74,.11);
      border-radius: 8px;
      color: var(--accent);
      background: rgba(223,233,223,.48);
      font-size: 12px;
    }

    .card-spacer { flex: 1; min-height: 22px; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 15px 0;
      margin-top: 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .metric strong,
    .metric span { display: block; }
    .metric strong { font-size: 14px; }
    .metric span { margin-top: 4px; color: var(--muted); font-size: 11px; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
    }

    .language {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .language-dot {
      width: 8px;
      height: 8px;
      flex: none;
      border-radius: 50%;
      background: var(--warm);
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 11px;
      color: #fff;
      background: var(--ink);
      font-size: 12px;
      transition: opacity .18s ease;
    }
    .repo-link:hover { opacity: .78; }

    .empty,
    .loading {
      grid-column: 1 / -1;
      min-height: 340px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(28,31,25,.14);
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.34);
    }

    .loading-ring {
      width: 38px;
      height: 38px;
      margin: 0 auto 16px;
      border: 3px solid rgba(63,96,74,.13);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .notice {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 18px;
      padding: 12px 15px;
      border: 1px solid rgba(185,116,70,.18);
      border-radius: 14px;
      color: #775139;
      background: rgba(247,232,219,.66);
      font-size: 13px;
    }
    .notice.show { display: flex; }

    footer {
      padding: 20px 0 45px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 920px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .search-wrap { grid-column: 1 / -1; }
      .card, .card.featured { grid-column: span 6; }
    }

    @media (max-width: 620px) {
      .shell { width: min(calc(100% - 20px), var(--max)); }
      .topbar { padding-top: 15px; }
      .top-meta { display: none; }
      .hero { min-height: 0; padding: 44px 24px; border-radius: 24px; }
      h1 { font-size: 48px; }
      .hero::before { right: -220px; }
      .controls { position: static; grid-template-columns: 1fr; }
      .search-wrap { grid-column: auto; }
      .select, .refresh-btn { width: 100%; }
      .section-head { align-items: start; flex-direction: column; }
      .card, .card.featured { grid-column: 1 / -1; min-height: 0; }
      .notice { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="#" aria-label="返回顶部">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>开源日见</span>
    </a>
    <div class="top-meta">GitHub Open Source Daily · 中文精选</div>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="eyebrow">Daily Open Source</div>
      <h1>每天，看见一个<br />值得打开的世界。</h1>
      <p>自动发现 GitHub 上近期活跃、增长迅速、真正可以使用的开源应用。英文项目会整理成中文，让你不用翻 README，也能快速判断它是否值得关注。</p>
      <div class="hero-status">
        <span><i class="status-dot" aria-hidden="true"></i> 每日自动更新</span>
        <span id="updatedAt">正在读取最新数据</span>
        <span id="sourceMode">GitHub 官方 API</span>
      </div>
    </section>

    <section aria-label="筛选工具">
      <div class="controls">
        <label class="search-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="搜索项目、功能或语言" autocomplete="off" />
        </label>
        <select id="sortSelect" class="select" aria-label="排序方式">
          <option value="score">综合热度</option>
          <option value="stars">Star 数量</option>
          <option value="recent">最近更新</option>
          <option value="newest">最新创建</option>
        </select>
        <button id="refreshBtn" class="refresh-btn" type="button">刷新数据</button>
      </div>

      <div id="categoryChips" class="chips" aria-label="分类筛选"></div>
      <div id="notice" class="notice"></div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2>今日值得看</h2>
          <p id="resultCount">正在筛选项目</p>
        </div>
        <p>不是仓库排行榜，而是可用产品清单</p>
      </div>
      <div id="repoGrid" class="grid" aria-live="polite">
        <div class="loading"><div><div class="loading-ring"></div>正在寻找今天值得关注的开源应用</div></div>
      </div>
    </section>
  </main>

  <footer class="shell">数据来自 GitHub 公开仓库。排序为编辑型算法结果，不代表 GitHub 官方推荐。</footer>

  <script>
    const state = {
      repos: [],
      category: '全部',
      query: '',
      sort: 'score',
      source: 'daily',
      generatedAt: null
    };

    const grid = document.getElementById('repoGrid');
    const chips = document.getElementById('categoryChips');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const refreshBtn = document.getElementById('refreshBtn');
    const resultCount = document.getElementById('resultCount');
    const updatedAt = document.getElementById('updatedAt');
    const sourceMode = document.getElementById('sourceMode');
    const notice = document.getElementById('notice');

    const categoryOrder = ['全部', 'AI 应用', '效率工具', '开发工具', '创意设计', '自托管', '其他'];

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function compactNumber(value = 0) {
      return new Intl.NumberFormat('zh-CN', { notation: 'compact', maximumFractionDigits: 1 }).format(value);
    }

    function formatDate(dateValue) {
      if (!dateValue) return '未知';
      const date = new Date(dateValue);
      if (Number.isNaN(date.getTime())) return '未知';
      return new Intl.DateTimeFormat('zh-CN', { month: 'short', day: 'numeric' }).format(date);
    }

    function relativeTime(dateValue) {
      if (!dateValue) return '时间未知';
      const diff = Date.now() - new Date(dateValue).getTime();
      const days = Math.max(0, Math.floor(diff / 86400000));
      if (days === 0) return '今天更新';
      if (days === 1) return '昨天更新';
      if (days < 30) return `${days} 天前更新`;
      return `${Math.floor(days / 30)} 个月前更新`;
    }

    function languageLabel(repo) {
      return repo.language || '多语言';
    }

    function normalizedRepo(repo, index) {
      const fullName = repo.fullName || repo.full_name || repo.name || '';
      const [owner = '', name = fullName] = fullName.split('/');
      return {
        id: repo.id || fullName || index,
        name: repo.name || name,
        fullName,
        owner: repo.owner || owner,
        url: repo.url || repo.html_url || '#',
        homepage: repo.homepage || '',
        descriptionZh: repo.descriptionZh || repo.description_zh || repo.description || '暂无中文简介',
        descriptionOriginal: repo.descriptionOriginal || repo.description_original || repo.description || '',
        summaryZh: repo.summaryZh || '',
        highlights: Array.isArray(repo.highlights) ? repo.highlights.slice(0, 4) : [],
        suitableFor: repo.suitableFor || '',
        category: repo.category || '其他',
        language: repo.language || '',
        license: repo.license || repo.licenseName || '未标明',
        stars: Number(repo.stars ?? repo.stargazers_count ?? 0),
        forks: Number(repo.forks ?? repo.forks_count ?? 0),
        score: Number(repo.score ?? repo.popularityScore ?? 0),
        createdAt: repo.createdAt || repo.created_at || null,
        pushedAt: repo.pushedAt || repo.pushed_at || repo.updatedAt || repo.updated_at || null,
        topics: Array.isArray(repo.topics) ? repo.topics : [],
        translationStatus: repo.translationStatus || 'done'
      };
    }

    async function loadDailyData(force = false) {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '读取中…';
      notice.classList.remove('show');
      try {
        const suffix = force ? `?t=${Date.now()}` : '';
        const response = await fetch(`data/repos.json${suffix}`, { cache: force ? 'no-store' : 'default' });
        if (!response.ok) throw new Error(`数据文件不可用：${response.status}`);
        const payload = await response.json();
        const items = Array.isArray(payload) ? payload : payload.items;
        if (!Array.isArray(items) || items.length === 0) throw new Error('每日数据尚未生成');
        state.repos = items.map(normalizedRepo);
        state.generatedAt = payload.generatedAt || payload.generated_at || null;
        state.source = 'daily';
        sourceMode.textContent = '每日自动整理 · 已中文化';
      } catch (error) {
        await loadLiveFallback();
        showNotice('当前正在使用 GitHub 实时备用数据。部署自动任务并配置翻译 API 后，页面会显示完整中文摘要。');
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = '刷新数据';
        updateHeader();
        renderChips();
        render();
      }
    }

    async function loadLiveFallback() {
      const since = new Date(Date.now() - 45 * 86400000).toISOString().slice(0, 10);
      const query = encodeURIComponent(`created:>=${since} stars:>30 fork:false archived:false`);
      const url = `https://api.github.com/search/repositories?q=${query}&sort=stars&order=desc&per_page=18`;
      const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
      if (!response.ok) throw new Error(`GitHub API 请求失败：${response.status}`);
      const payload = await response.json();
      state.repos = (payload.items || []).map((repo, index) => normalizedRepo({
        ...repo,
        descriptionZh: repo.description || '暂无简介',
        descriptionOriginal: repo.description || '',
        category: inferCategory(repo),
        score: Math.max(1, Math.round(Math.log10((repo.stargazers_count || 0) + 10) * 24 - index)),
        license: repo.license?.spdx_id || '未标明',
        translationStatus: 'pending'
      }, index));
      state.generatedAt = new Date().toISOString();
      state.source = 'live';
      sourceMode.textContent = 'GitHub 实时备用数据 · 未翻译';
    }

    function inferCategory(repo) {
      const text = `${repo.name || ''} ${repo.description || ''} ${(repo.topics || []).join(' ')}`.toLowerCase();
      if (/ai|llm|agent|chatbot|image generation|machine learning|voice/.test(text)) return 'AI 应用';
      if (/self-host|selfhost|homelab|server/.test(text)) return '自托管';
      if (/design|image|video|audio|creative|drawing|photo/.test(text)) return '创意设计';
      if (/developer|devtool|terminal|cli|code|editor|database|api/.test(text)) return '开发工具';
      if (/productivity|note|task|calendar|workflow|automation|office/.test(text)) return '效率工具';
      return '其他';
    }

    function showNotice(message) {
      notice.innerHTML = `<span>${escapeHtml(message)}</span><span>自动任务配置见项目 README</span>`;
      notice.classList.add('show');
    }

    function updateHeader() {
      if (state.generatedAt) {
        updatedAt.textContent = `更新于 ${new Intl.DateTimeFormat('zh-CN', {
          month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }).format(new Date(state.generatedAt))}`;
      } else {
        updatedAt.textContent = '更新时间未知';
      }
    }

    function renderChips() {
      const existing = new Set(state.repos.map(repo => repo.category));
      const categories = categoryOrder.filter(category => category === '全部' || existing.has(category));
      chips.innerHTML = categories.map(category => `
        <button type="button" class="chip ${state.category === category ? 'active' : ''}" data-category="${escapeHtml(category)}">
          ${escapeHtml(category)}
        </button>
      `).join('');

      chips.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          renderChips();
          render();
        });
      });
    }

    function getFilteredRepos() {
      const query = state.query.trim().toLowerCase();
      const filtered = state.repos.filter(repo => {
        const categoryMatch = state.category === '全部' || repo.category === state.category;
        const haystack = [
          repo.name, repo.fullName, repo.descriptionZh, repo.descriptionOriginal,
          repo.summaryZh, repo.suitableFor, repo.language, repo.category,
          ...repo.highlights, ...repo.topics
        ].join(' ').toLowerCase();
        return categoryMatch && (!query || haystack.includes(query));
      });

      return filtered.sort((a, b) => {
        if (state.sort === 'stars') return b.stars - a.stars;
        if (state.sort === 'recent') return new Date(b.pushedAt || 0) - new Date(a.pushedAt || 0);
        if (state.sort === 'newest') return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        return b.score - a.score || b.stars - a.stars;
      });
    }

    function render() {
      const repos = getFilteredRepos();
      resultCount.textContent = `共 ${repos.length} 个项目 · ${state.category}`;

      if (!repos.length) {
        grid.innerHTML = '<div class="empty"><div><strong>没有找到匹配的项目</strong><br><br>换一个关键词或分类试试。</div></div>';
        return;
      }

      grid.innerHTML = repos.map((repo, index) => cardTemplate(repo, index)).join('');
    }

    function cardTemplate(repo, index) {
      const featured = index < 2 ? 'featured' : '';
      const translated = repo.descriptionOriginal && repo.descriptionZh && repo.descriptionOriginal.trim() !== repo.descriptionZh.trim();
      const description = repo.summaryZh || repo.descriptionZh;
      const highlights = repo.highlights.length
        ? `<div class="highlights">${repo.highlights.map(item => `<span class="highlight">${escapeHtml(item)}</span>`).join('')}</div>`
        : '';
      const original = translated
        ? `<div class="original">原文：${escapeHtml(repo.descriptionOriginal)}</div>`
        : '';

      return `
        <article class="card ${featured}">
          <div class="card-top">
            <span class="rank">${String(index + 1).padStart(2, '0')}</span>
            <span class="category">${escapeHtml(repo.category)}</span>
          </div>
          <h3 class="repo-title">${escapeHtml(repo.name)}</h3>
          <p class="owner">${escapeHtml(repo.fullName)}</p>
          <p class="description">${escapeHtml(description)}</p>
          ${original}
          ${highlights}
          <div class="card-spacer"></div>
          <div class="metrics">
            <div class="metric"><strong>★ ${compactNumber(repo.stars)}</strong><span>Stars</span></div>
            <div class="metric"><strong>⑂ ${compactNumber(repo.forks)}</strong><span>Forks</span></div>
            <div class="metric"><strong>${escapeHtml(repo.license)}</strong><span>License</span></div>
          </div>
          <div class="card-footer">
            <span class="language" title="${escapeHtml(relativeTime(repo.pushedAt))}">
              <i class="language-dot" aria-hidden="true"></i>
              ${escapeHtml(languageLabel(repo))} · ${escapeHtml(formatDate(repo.pushedAt))}
            </span>
            <a class="repo-link" href="${escapeHtml(repo.url)}" target="_blank" rel="noopener noreferrer">
              打开项目
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
        </article>
      `;
    }

    searchInput.addEventListener('input', event => {
      state.query = event.target.value;
      render();
    });

    sortSelect.addEventListener('change', event => {
      state.sort = event.target.value;
      render();
    });

    refreshBtn.addEventListener('click', () => loadDailyData(true));

    loadDailyData().catch(error => {
      grid.innerHTML = `<div class="empty"><div><strong>暂时无法读取数据</strong><br><br>${escapeHtml(error.message)}</div></div>`;
      refreshBtn.disabled = false;
      refreshBtn.textContent = '重新尝试';
    });
  </script>
</body>
</html>
